name: Clojure CI

on:
  push:
  pull_request:
    branches: [ devel ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: check out repo
      uses: actions/checkout@v5

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 11

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        # Install just one or all simultaneously
        # The value must indicate a particular version of the tool, or use 'latest'
        # to always provision the latest version
        cli: 1.11.4.1474
        lein: 2.12.0
        cljfmt: latest

    - name: Extract BEAM dep version
      shell: bash
      run: echo "BEAM_SDK_VERSION=$(grep org.apache.beam/beam-sdks-java-core project.clj | awk -F '\"' '{print $2;}')" >> $GITHUB_ENV

    # Optional step:
    - name: Cache clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
        # List all files containing dependencies:
        key: cljdeps-${{ github.event.repository.name }}-${{ env.BEAM_SDK_VERSION }}
        restore-keys: cljdeps-

    - name: Lint
      run: lein cljfmt check

    - name: Install dependencies
      run: lein deps

    - name: Run tests
      run: lein test
